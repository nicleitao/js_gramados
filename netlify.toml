# Configuração usada pelo Netlify ao publicar a partir do GitHub
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivos com hash no nome (JS, CSS, fontes) podem ficar em cache por 1 ano
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
